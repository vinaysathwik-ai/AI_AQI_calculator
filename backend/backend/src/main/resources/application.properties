spring.application.name=backend

# FastAPI URL
fastapi.url=${FASTAPI_URL:http://127.0.0.1:8000/predict}

# Datasource configuration (H2 by default, PostgreSQL if DB_URL is supplied)
spring.datasource.url=${DB_URL:jdbc:h2:mem:smartaqidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
